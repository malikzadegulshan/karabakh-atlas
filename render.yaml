# Render Blueprint — deploys the backend API, the static frontend, and a
# free PostgreSQL database together. In the Render dashboard: New +  →
# Blueprint → point it at this repo. If any field names here have drifted
# from Render's current schema, the same three services can be created
# by hand from the dashboard using the same settings.
databases:
  - name: karabakh-atlas-db
    plan: free
    databaseName: karabakh_atlas
    user: karabakh_atlas

services:
  - type: web
    name: karabakh-atlas-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT api.v1.app:app
    envVars:
      - key: KBA_TYPE_STORAGE
        value: db
      - key: KBA_AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: karabakh-atlas-db
          property: connectionString
      # Signs session cookies — must stay stable across restarts and be
      # shared by every worker process, which generateValue guarantees
      # (it's set once at provision time, not re-rolled per deploy).
      - key: KBA_SECRET_KEY
        generateValue: true
      # Frontend and API are separate Render subdomains, i.e. different
      # sites — session cookies need SameSite=None (+ Secure, both
      # served over HTTPS by Render) to survive that, and CORS needs the
      # frontend's exact origin since credentialed requests can't use "*".
      - key: KBA_COOKIE_SAMESITE
        value: "None"
      - key: KBA_COOKIE_SECURE
        value: "true"
      - key: KBA_FRONTEND_ORIGIN
        value: "https://karabakh-atlas-frontend.onrender.com"
      # Bootstraps the first admin account on boot (idempotent — safe to
      # leave set). Fill these in via the Render dashboard's environment
      # tab after the first deploy, not here — never commit real
      # credentials. Once the admin account exists, these can be removed;
      # further admins/roles can then be managed through the account
      # system itself.
      - key: KBA_ADMIN_EMAIL
        sync: false
      - key: KBA_ADMIN_PASSWORD
        sync: false
      - key: KBA_ADMIN_NAME
        sync: false
      # Sends registration verification emails via Gmail SMTP. Fill in
      # via the dashboard, same as the admin vars above — never commit
      # real credentials. KBA_SMTP_PASSWORD is a Gmail "App Password",
      # not the actual account password. Left unset, verification
      # emails just don't send (registration still works either way).
      - key: KBA_SMTP_HOST
        value: smtp.gmail.com
      - key: KBA_SMTP_PORT
        value: "587"
      - key: KBA_SMTP_USER
        sync: false
      - key: KBA_SMTP_PASSWORD
        sync: false

  - type: web
    name: karabakh-atlas-frontend
    runtime: static
    staticPublishPath: frontend
    buildCommand: ""
    envVars: []
    # X-Frame-Options/frame-ancestors specifically can't be set via a
    # <meta> tag (only a real HTTP header), so it's here rather than in
    # index.html alongside the rest of the CSP. The other two are
    # redundant with what a browser already infers, but cheap and
    # standard to make explicit. Verify these actually come back after
    # deploying (e.g. `curl -I`) — if Render's header syntax has moved
    # on from this, the same effect can be set by hand from the
    # dashboard's Headers tab for this service.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
