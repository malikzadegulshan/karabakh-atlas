name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kba_test
          POSTGRES_PASSWORD: kba_test
          POSTGRES_DB: kba_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (pycodestyle)
        run: pycodestyle api/ models/ tests/ *.py

      - name: Run tests (FileStorage backend)
        env:
          KBA_TYPE_STORAGE: file
          KBA_ENV: test
        run: python3 -m unittest discover tests

      - name: Run tests (PostgreSQL backend)
        env:
          KBA_TYPE_STORAGE: db
          KBA_ENV: test
          KBA_DB_USER: kba_test
          KBA_DB_PWD: kba_test
          KBA_DB_HOST: localhost
          KBA_DB_NAME: kba_test_db
        run: python3 -m unittest discover tests
