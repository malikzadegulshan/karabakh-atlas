openapi: 3.0.3
info:
  title: Karabakh Atlas API
  description: >
    REST API serving region/city data for the Karabakh Atlas map website.
    Region/city write endpoints (POST/PUT/DELETE) require a logged-in
    session with the "admin" role (see /auth/login). Anyone can register
    an account via /auth/register, but new accounts get the "user" role,
    which can read everything but not write regions/cities.
  version: "1.0"
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        Session cookie set by POST /auth/login or /auth/register. The
        session user additionally needs the "admin" role for
        region/city write endpoints.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Region:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          nullable: true
    City:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        region_id:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        description:
          type: string
          nullable: true
        alt_names:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        image_credit:
          type: string
          nullable: true
        category:
          type: string
          description: >
            "city" renders as a persistent map label; any other value is
            a user-added point of interest shown only when zoomed in.
          enum: [city, road, cafe, restaurant, hotel, landmark, museum,
                  park, university, school, hospital, pharmacy, bank,
                  government, police, fire_station, mosque, church,
                  fuel_station, parking, shop, other]
          default: city
        name_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        description_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    CityInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name:
          type: string
          maxLength: 128
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
        description:
          type: string
          nullable: true
        alt_names:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        image_credit:
          type: string
          nullable: true
        category:
          type: string
          description: >
            "city" renders as a persistent map label; any other value is
            a user-added point of interest shown only when zoomed in.
            Defaults to "city" when omitted.
          enum: [city, road, cafe, restaurant, hotel, landmark, museum,
                  park, university, school, hospital, pharmacy, bank,
                  government, police, fire_station, mosque, church,
                  fuel_station, parking, shop, other]
        name_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        description_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
    Error:
      type: object
      properties:
        error:
          type: string
paths:
  /status:
    get:
      summary: Health check
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  /stats:
    get:
      summary: Object counts
      responses:
        "200":
          description: Counts of regions and cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: integer
                  cities:
                    type: integer
  /regions:
    get:
      summary: List all regions
      responses:
        "200":
          description: List of regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
    post:
      summary: Create a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionInput"
      responses:
        "201":
          description: Region created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
        "403":
          description: Admin privileges required
  /regions/{region_id}:
    parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one region
      responses:
        "200":
          description: The region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "404":
          description: Not found
    put:
      summary: Update a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      summary: Delete a region
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /regions/{region_id}/cities:
    parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List cities in a region
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "404":
          description: Region not found
    post:
      summary: Create a city in a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "201":
          description: City created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          description: Validation error
        "404":
          description: Region not found
  /cities:
    get:
      summary: List all cities
      parameters:
        - name: q
          in: query
          description: Filter by name (case-insensitive substring)
          schema:
            type: string
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
  /cities/{city_id}:
    parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one city
      responses:
        "200":
          description: The city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          description: Not found
    put:
      summary: Update a city
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "200":
          description: Updated city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      summary: Delete a city
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /auth/register:
    post:
      summary: Create an account (role "user") and log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 128
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "409":
          description: Email already registered
  /auth/login:
    post:
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "401":
          description: Invalid email or password
        "429":
          description: Too many failed attempts — try again later
  /auth/logout:
    post:
      summary: Clear the current session
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      summary: Return the current logged-in user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
