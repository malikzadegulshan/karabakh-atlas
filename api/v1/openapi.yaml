openapi: 3.0.3
info:
  title: Karabakh Atlas API
  description: >
    REST API serving region/city data for the Karabakh Atlas map website.
    Region/city write endpoints (POST/PUT/DELETE) require a logged-in
    session with the "admin" role (see /auth/login). Anyone can register
    an account via /auth/register, but new accounts get the "user" role,
    which can read everything but not write regions/cities.
  version: "1.0"
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        Session cookie set by POST /auth/login or /auth/register. The
        session user additionally needs the "admin" role for
        region/city write endpoints.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Region:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          nullable: true
    City:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        region_id:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        description:
          type: string
          nullable: true
        alt_names:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        image_credit:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        category:
          type: string
          description: >
            "city" renders as a persistent map label; any other value is
            a user-added point of interest shown only when zoomed in.
          enum: [city, road, cafe, restaurant, hotel, landmark, museum,
                  park, university, school, hospital, pharmacy, bank,
                  government, police, fire_station, mosque, church,
                  fuel_station, parking, shop, other]
          default: city
        name_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        description_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    CityInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name:
          type: string
          maxLength: 128
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
        description:
          type: string
          nullable: true
        alt_names:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        image_credit:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        category:
          type: string
          description: >
            "city" renders as a persistent map label; any other value is
            a user-added point of interest shown only when zoomed in.
            Defaults to "city" when omitted.
          enum: [city, road, cafe, restaurant, hotel, landmark, museum,
                  park, university, school, hospital, pharmacy, bank,
                  government, police, fire_station, mosque, church,
                  fuel_station, parking, shop, other]
        name_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
        description_i18n:
          type: object
          nullable: true
          additionalProperties:
            type: string
    ForumPost:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        author_id:
          type: string
          readOnly: true
        author_name:
          type: string
          readOnly: true
        target_city_id:
          type: string
          nullable: true
          description: >
            The city/POI this opinion is about, or null for a general
            opinion about Karabakh as a whole.
        target_city_name:
          type: string
          nullable: true
          readOnly: true
        body:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [pending, approved, rejected]
          readOnly: true
        moderated_by:
          type: string
          nullable: true
          readOnly: true
        moderated_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ForumPostInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000
        target_city_id:
          type: string
          nullable: true
    HistoricalEvent:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        year:
          type: integer
          description: >
            Must fall within the range the historical-imagery timeline
            actually covers (~2014 onward) — see EVENT_YEAR_MIN in
            api/v1/views/historical_events.py.
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        description:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    HistoricalEventInput:
      type: object
      required: [title, year, latitude, longitude]
      properties:
        title:
          type: string
          maxLength: 200
        year:
          type: integer
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        description:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: string
paths:
  /status:
    get:
      summary: Health check
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  /stats:
    get:
      summary: Public counts for the "about this atlas" dashboard
      description: >
        Only ever counts what's already publicly visible elsewhere in
        the API (e.g. approved forum posts, not pending/rejected ones)
        — safe to leave unauthenticated.
      responses:
        "200":
          description: Object counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: integer
                  cities:
                    type: integer
                    description: Places with category "city"
                  points_of_interest:
                    type: integer
                    description: Places with any other category
                  categories:
                    type: object
                    description: >
                      Point-of-interest count per category (e.g.
                      {"museum": 3, "cafe": 5, ...})
                    additionalProperties:
                      type: integer
                  historical_events:
                    type: integer
                  forum_posts:
                    type: integer
                    description: Approved (publicly visible) posts only
  /regions:
    get:
      summary: List all regions
      responses:
        "200":
          description: List of regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
    post:
      summary: Create a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionInput"
      responses:
        "201":
          description: Region created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
        "403":
          description: Admin privileges required
  /regions/{region_id}:
    parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one region
      responses:
        "200":
          description: The region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "404":
          description: Not found
    put:
      summary: Update a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      summary: Delete a region
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /regions/{region_id}/cities:
    parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List cities in a region
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "404":
          description: Region not found
    post:
      summary: Create a city in a region
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "201":
          description: City created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          description: Validation error
        "404":
          description: Region not found
  /cities:
    get:
      summary: List all cities
      parameters:
        - name: q
          in: query
          description: Filter by name (case-insensitive substring)
          schema:
            type: string
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
  /cities/{city_id}:
    parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one city
      responses:
        "200":
          description: The city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          description: Not found
    put:
      summary: Update a city
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "200":
          description: Updated city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      summary: Delete a city
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /auth/register:
    post:
      summary: Create an account (role "user") and log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 128
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "409":
          description: Email already registered
  /auth/login:
    post:
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "401":
          description: Invalid email or password
        "429":
          description: Too many failed attempts — try again later
  /auth/logout:
    post:
      summary: Clear the current session
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      summary: Return the current logged-in user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
  /auth/forgot-password:
    post:
      summary: Email a time-limited OTP for resetting a forgotten password
      description: >
        Always returns 200 regardless of whether the email is
        registered, so this can't be used to enumerate accounts. The
        code expires in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: >
            Request accepted (an email was sent only if the address is
            registered)
        "400":
          description: Validation error
        "429":
          description: Too many requests — try again later
  /auth/reset-password:
    post:
      summary: Set a new password using a forgot-password OTP, and log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, password]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  maxLength: 6
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Password reset; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error, or invalid/expired code
        "429":
          description: Too many attempts — try again later
  /forum/posts:
    get:
      summary: List forum posts
      description: >
        Defaults to only "approved" posts. ?mine=true (requires login)
        returns the caller's own posts regardless of status. ?status=
        (pending/approved/rejected) is only honored for an admin
        caller — anyone else's request for it silently falls back to
        approved-only, so unmoderated content never leaks.
      parameters:
        - name: city_id
          in: query
          description: >
            Only posts about this city/POI. Omit for general
            (target_city_id is null) opinions about Karabakh overall.
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of forum posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumPost"
        "401":
          description: mine=true without a session
    post:
      summary: Submit an opinion (always starts "pending")
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumPostInput"
      responses:
        "201":
          description: Post created, pending moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          description: Validation error
        "401":
          description: Login required
        "429":
          description: Too many posts submitted recently — try again later
  /forum/posts/{post_id}:
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete a post (its own author, or any admin)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "401":
          description: Login required
        "403":
          description: Not allowed to delete this post
        "404":
          description: Not found
  /forum/posts/{post_id}/status:
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Approve or reject a post (admin only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        "200":
          description: Post moderated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          description: Validation error
        "401":
          description: Login required
        "403":
          description: Admin privileges required
  /favorites:
    get:
      summary: List the logged-in caller's saved places
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of saved cities/POIs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "401":
          description: Login required
    post:
      summary: Save a place (idempotent — favoriting twice is a no-op)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id]
              properties:
                city_id:
                  type: string
      responses:
        "201":
          description: Favorite created
        "200":
          description: Already favorited — existing favorite returned
        "400":
          description: Validation error, or city_id does not exist
        "401":
          description: Login required
  /favorites/{city_id}:
    parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: >
        Un-save a place (idempotent — removing something not saved,
        or already removed, is still a 200)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Removed (or wasn't saved in the first place)
        "401":
          description: Login required
        "404":
          description: Not found
  /historical-events:
    get:
      summary: List all historical events, sorted by year
      responses:
        "200":
          description: List of historical events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoricalEvent"
    post:
      summary: Create a historical event
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalEventInput"
      responses:
        "201":
          description: Historical event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalEvent"
        "400":
          description: Validation error
        "401":
          description: Login required
        "403":
          description: Admin privileges required
  /historical-events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update a historical event
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalEventInput"
      responses:
        "200":
          description: Updated historical event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalEvent"
        "400":
          description: Validation error
        "401":
          description: Login required
        "403":
          description: Admin privileges required
        "404":
          description: Not found
    delete:
      summary: Delete a historical event
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deleted
        "401":
          description: Login required
        "403":
          description: Admin privileges required
        "404":
          description: Not found
