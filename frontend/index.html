<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karabakh Atlas — Demo</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Karabakh Atlas</h1>
    <p>MVP demo — cities loaded live from the backend API.</p>
  </header>
  <main>
    <aside id="sidebar">
      <p id="status">Loading…</p>
      <ul id="city-list"></ul>
      <div id="city-detail"></div>
    </aside>
    <button id="sidebar-toggle" aria-label="Close city list">‹</button>
    <div id="map"></div>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
