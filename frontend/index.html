<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- X-Frame-Options/frame-ancestors need a real HTTP header (see
       render.yaml) — a <meta> CSP can't set those, only the directives
       below. connect-src lists every origin app.js actually fetches
       from: the weather API, this app's own backend (both the deployed
       one and local dev), and Esri's Wayback release config for the
       historical-imagery layer. img-src stays broad (any https origin)
       because city photos are arbitrary admin-supplied URLs, and the
       historical/satellite map tile hosts are resolved at runtime from
       that same Esri config rather than being a fixed domain. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' https: data:;
    connect-src 'self' https://api.open-meteo.com https://karabakh-atlas-api.onrender.com http://localhost:5000 https://s3-us-west-2.amazonaws.com;
    font-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'self'
  ">
  <title>Dirchalish - Atlas of Karabakh</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <h1 id="app-title" class="sr-only">Karabakh Atlas</h1>
  <main>
    <nav id="rail">
      <div id="brand-mark" data-icon="logo_mark" aria-hidden="true"></div>
      <button type="button" id="rail-cities" class="rail-btn active" data-icon="rail_cities" aria-label="Cities"></button>
      <button type="button" id="rail-places" class="rail-btn" data-icon="rail_places" aria-label="Places"></button>
      <button type="button" id="rail-forum" class="rail-btn" data-icon="rail_forum" aria-label="Forum"></button>
      <div class="rail-spacer"></div>
      <button type="button" id="admin-toggle" class="rail-btn" hidden data-icon="rail_admin" aria-label="Manage"></button>
      <div id="lang-switcher" class="rail-widget">
        <button type="button" id="lang-toggle" class="rail-btn" aria-haspopup="true" aria-expanded="false">
          <span id="lang-toggle-label">EN</span>
        </button>
        <div id="lang-menu" role="menu" hidden>
          <button type="button" data-lang="en" role="menuitem" aria-label="English">EN</button>
          <button type="button" data-lang="az" role="menuitem" aria-label="Azərbaycanca">AZ</button>
          <button type="button" data-lang="tr" role="menuitem" aria-label="Türkçe">TR</button>
          <button type="button" data-lang="ru" role="menuitem" aria-label="Русский">RU</button>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="rail-btn" data-icon="theme_light" aria-pressed="false" aria-label="Toggle dark mode"></button>
      <div id="account-widget" class="rail-widget">
        <button type="button" id="account-signin-toggle" class="rail-btn" data-icon="rail_account" aria-label="Sign in"></button>
        <button type="button" id="account-avatar-toggle" class="rail-btn" hidden aria-haspopup="true" aria-expanded="false"></button>
        <div id="account-status" role="menu" hidden>
          <span id="account-name"></span>
          <button type="button" id="account-resend-verification" hidden>Verify email</button>
          <button type="button" id="account-logout">Log out</button>
        </div>
      </div>
    </nav>

    <aside id="panel">
      <button type="button" id="panel-handle" aria-label="Resize panel"></button>
      <div id="sheet-tabs">
        <button type="button" id="sheet-tab-cities" class="sheet-tab active">Cities</button>
        <button type="button" id="sheet-tab-places" class="sheet-tab">Places</button>
        <button type="button" id="sheet-tab-forum" class="sheet-tab">Forum</button>
      </div>
      <div id="panel-content">
        <div id="search-box">
          <input type="text" id="search-input" placeholder="Search places…" autocomplete="off">
        </div>

        <div id="weather-panel">
          <div id="weather-city"></div>
          <div id="weather-main">
            <span id="weather-icon"></span>
            <span id="weather-temp"></span>
          </div>
          <div id="weather-desc"></div>
          <div id="weather-meta"></div>
        </div>

        <div id="panel-view-cities" class="panel-view">
          <p id="status">Loading…</p>
          <ul id="city-list"></ul>
        </div>

        <div id="panel-view-places" class="panel-view" hidden>
          <div id="category-grid"></div>
        </div>

        <div id="panel-view-forum" class="panel-view" hidden>
          <div id="forum-general-section">
            <form id="forum-composer" class="admin-form">
              <textarea id="forum-body-input" rows="3" maxlength="2000"></textarea>
              <button type="submit" id="forum-submit">Post</button>
            </form>
            <button type="button" id="forum-signin-prompt" class="forum-signin-btn" hidden>Sign in to share your opinion</button>
            <p id="forum-pending-notice" hidden></p>
            <ul id="forum-list"></ul>
          </div>
        </div>

        <div id="detail-view" hidden>
          <button type="button" id="detail-back" class="detail-back-btn" data-icon="detail_back" aria-label="Back"></button>
          <div id="city-detail"></div>
        </div>
      </div>
    </aside>
    <button id="panel-toggle" aria-label="Close city list">‹</button>

    <div id="map"></div>

    <div id="map-pick-banner" hidden>
      <span>Click anywhere on the map to set the location</span>
      <button type="button" id="map-pick-cancel">Cancel</button>
    </div>
    <div id="timeline" hidden>
      <span id="year-label">2026</span>
      <input type="range" id="year-slider" min="2000" max="2026" value="2026" step="1">
    </div>
  </main>

  <div id="account-overlay" hidden>
    <div id="account-panel" role="dialog" aria-modal="true" aria-labelledby="account-title">
      <div class="admin-panel-header">
        <h2 id="account-title">Sign in</h2>
        <button type="button" id="account-close" aria-label="Close">×</button>
      </div>
      <div id="account-message" class="admin-message" hidden></div>
      <div class="account-tabs">
        <button type="button" id="account-tab-login" class="account-tab active">Sign in</button>
        <button type="button" id="account-tab-register" class="account-tab">Create account</button>
      </div>
      <form id="login-form" class="admin-form">
        <input type="email" id="login-email-input" required autocomplete="username">
        <input type="password" id="login-password-input" required autocomplete="current-password">
        <button type="submit" id="login-form-submit">Sign in</button>
      </form>
      <form id="register-form" class="admin-form" hidden>
        <input type="text" id="register-name-input" required maxlength="128" autocomplete="name">
        <input type="email" id="register-email-input" required autocomplete="username">
        <input type="password" id="register-password-input" required minlength="8" autocomplete="new-password">
        <label class="account-legal-checkbox">
          <input type="checkbox" id="register-legal-checkbox" required>
          <span id="account-legal-note"></span>
        </label>
        <button type="submit" id="register-form-submit">Create account</button>
      </form>
    </div>
  </div>

  <div id="admin-overlay" hidden>
    <div id="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
      <div class="admin-panel-header">
        <h2 id="admin-title">Manage Data</h2>
        <button type="button" id="admin-close" aria-label="Close">×</button>
      </div>
      <div id="admin-message" class="admin-message" hidden></div>
      <div class="admin-panel-body">
        <div class="admin-tabs">
          <button type="button" id="admin-tab-data" class="admin-tab active">Regions &amp; cities</button>
          <button type="button" id="admin-tab-events" class="admin-tab">Timeline events</button>
          <button type="button" id="admin-tab-forum" class="admin-tab">Forum moderation</button>
        </div>

        <div id="admin-view-data" class="admin-view">
          <section class="admin-section">
            <h3 id="admin-add-region-title">Add region</h3>
            <form id="region-form" class="admin-form">
              <input type="text" id="region-name-input" required maxlength="128">
              <textarea id="region-description-input" rows="2"></textarea>
              <button type="submit" id="region-form-submit">Add region</button>
            </form>
          </section>
          <section class="admin-section">
            <h3 id="admin-regions-title">Regions &amp; cities</h3>
            <div id="admin-regions-list"></div>
          </section>
        </div>

        <div id="admin-view-events" class="admin-view" hidden>
          <section class="admin-section">
            <h3 id="admin-add-event-title">Add timeline event</h3>
            <form id="event-form" class="admin-form">
              <input type="text" id="event-title-input" required maxlength="200">
              <input type="number" id="event-year-input" required step="1">
              <input type="number" id="event-lat-input" step="any" required>
              <input type="number" id="event-lng-input" step="any" required>
              <button type="button" id="event-pick-on-map" class="pick-on-map">Pick on map</button>
              <textarea id="event-description-input" rows="2"></textarea>
              <input type="url" id="event-source-input" maxlength="500">
              <button type="submit" id="event-form-submit">Add event</button>
            </form>
          </section>
          <section class="admin-section">
            <h3 id="admin-events-title">Timeline events</h3>
            <div id="admin-events-list"></div>
          </section>
        </div>

        <div id="admin-view-forum" class="admin-view" hidden>
          <section class="admin-section">
            <h3 id="admin-forum-title">Forum moderation</h3>
            <div id="admin-forum-list"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/icons/icons.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="forum.js"></script>
</body>
</html>
